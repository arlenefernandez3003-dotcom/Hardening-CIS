config system global
    set hostname "FW-CIS"
    set admintimeout 480
    set admin-lockout-threshold 10
    set admin-telnet enable
    set admin-https-ssl-versions tlsv1-1 tlsv1-2 tlsv1-3
end

config system interface
    edit "port1"
        set mode static
        set ip 10.7.30.67 255.255.255.248
        set allowaccess ping https ssh http telnet
        set alias "TRANSITO-R"
        set role wan
        set mtu-override enable
        set mtu 1480
        set tcp-mss 1440
    next
    edit "port2"
        set alias "TRUNK-SW"
        set role undefined
    next
    edit "VLAN99"
        set vdom "root"
        set type vlan
        set interface "port2"
        set vlanid 99
        set mode static
        set ip 10.7.30.2 255.255.255.224
        set allowaccess ping https ssh http telnet
        set alias "GESTION"
        set role lan
        set mtu-override enable
        set mtu 1480
        set tcp-mss 1440
    next
    edit "VLAN10"
        set vdom "root"
        set type vlan
        set interface "port2"
        set vlanid 10
        set mode static
        set ip 10.7.30.34 255.255.255.224
        set allowaccess ping
        set alias "USUARIOS"
        set role lan
        set mtu-override enable
        set mtu 1480
        set tcp-mss 1440
    next
end

config system dhcp server
    edit 1
        set interface "VLAN10"
        set default-gateway 10.7.30.34
        set netmask 255.255.255.224
        set dns-service specify
        set dns-server1 8.8.8.8
        set dns-server2 8.8.4.4
        set lease-time 86400
        config ip-range
            edit 1
                set start-ip 10.7.30.40
                set end-ip 10.7.30.62
            next
        end
    next
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 10.7.30.66
        set device "port1"
    next
end

config firewall policy
    edit 1
        set name "LAN-to-Transito"
        set srcintf "VLAN10" "VLAN99"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end

config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end
